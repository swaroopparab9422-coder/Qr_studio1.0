name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Install Inno Setup (for the installer)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build EXE and installer
        shell: cmd
        run: build_windows.bat

      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path "dist/QR Studio/*" -DestinationPath QR_Studio_Windows.zip

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: QR_Studio_Windows
          path: |
            QR_Studio_Windows.zip
            installer/QR_Studio_Setup.exe
          if-no-files-found: warn

      - name: Attach to GitHub Release (only for version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            QR_Studio_Windows.zip
            installer/QR_Studio_Setup.exe
